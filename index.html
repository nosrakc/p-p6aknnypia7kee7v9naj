<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Sire Picker</title>
<style>
:root { --bg:#f6f3ee; --card:#ffffff; --ink:#1d1b18; --muted:#5f5a52; --line:#ddd5c8; --accent:#c96a1b; --accent-soft:#fbebdc;
        --rec:#2a6b3c; --rec-soft:#e6f2e9; --chosen:#1f4e8c; --chosen-soft:#e3ecf8; --flag:#9a4a00; --flag-soft:#fff3e0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system, "PingFang TC", "Helvetica Neue", sans-serif; font-size:18px; }
body { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
header { position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 16px 8px; border-bottom:1px solid var(--line); }
.row { display:flex; gap:8px; align-items:center; }
.bar { flex:1; height:10px; background:#e8e1d6; border-radius:6px; overflow:hidden; }
.bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
#count { font-weight:700; font-variant-numeric:tabular-nums; min-width:76px; text-align:right; }
button { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:12px; padding:10px 12px; cursor:pointer; }
button:active { transform:scale(.98); }
.btn-accent { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
.tools { margin-top:8px; flex-wrap:wrap; }
.tools button { flex:1 1 auto; }
#openQ { flex-basis:100%; }
.tools input { width:84px; font:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:12px; }
main { padding:12px 16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
.num { color:var(--muted); font-size:16px; }
h1 { font-size:28px; line-height:1.15; margin:2px 0 6px; overflow-wrap:anywhere; }
.meta { color:var(--muted); font-size:16px; margin-bottom:8px; }
.who { font-size:17px; line-height:1.4; margin:8px 0 12px; }

.resolved { background:var(--rec-soft); color:var(--rec); border:2px solid var(--rec); border-radius:12px; padding:10px 12px; font-size:17px; font-weight:600; margin-bottom:12px; }
.decided { background:var(--chosen-soft); color:var(--chosen); border:2px solid var(--chosen); border-radius:12px; padding:10px 12px; font-size:17px; font-weight:600; margin-bottom:12px; }
.hold { background:var(--flag-soft); color:var(--flag); border:2px solid var(--flag); border-radius:12px; padding:10px 12px; font-size:16px; font-weight:600; margin-bottom:12px; }
.opt.recorded .zh::after { content:' ✓'; color:var(--chosen); }
.flag { background:var(--flag-soft); color:var(--flag); border-radius:10px; padding:8px 10px; font-size:16px; margin-bottom:12px; }
.opt { display:block; width:100%; text-align:left; margin:10px 0; padding:14px; border-width:2px; border-radius:16px; }
.opt .top { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.opt .k { font-weight:800; color:var(--muted); font-size:20px; }
.opt .zh { font-size:30px; font-weight:700; letter-spacing:1px; }
.opt .src { font-size:14px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 8px; }
.opt .x { font-size:16px; color:var(--muted); margin-top:6px; line-height:1.35; }
.opt.rec { border-color:var(--rec); background:var(--rec-soft); }
.opt .tag { font-size:15px; font-weight:700; color:#fff; background:var(--rec); border-radius:999px; padding:2px 10px; }
.opt.chosen, .alt.chosen { border-color:var(--chosen); background:var(--chosen-soft); box-shadow:0 0 0 2px var(--chosen) inset; }
.pr { font-size:15px; color:var(--rec); margin:-2px 0 6px 4px; }
.alts { display:flex; gap:10px; margin-top:6px; }
.alt { flex:1; padding:14px; border-radius:14px; border-width:2px; }
.own { display:flex; gap:8px; margin-top:10px; }
.own input { flex:1; min-width:0; font:inherit; font-size:22px; padding:12px; border:2px solid var(--line); border-radius:14px; }
.state { margin-top:10px; font-size:16px; color:var(--chosen); font-weight:600; min-height:22px; }
nav { position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--bg); border-top:1px solid var(--line);
      padding:10px 16px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; }
nav button { flex:1; padding:14px; font-size:18px; }
#reminder { display:none; margin:0 16px 0; background:var(--accent-soft); border:1px solid var(--accent); border-radius:14px; padding:10px 12px; }
#reminder .row { justify-content:space-between; }
.sheet { display:none; position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.35); }
.sheet > div { position:absolute; left:0; right:0; bottom:0; background:#fff; border-radius:20px 20px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto; }
.sheet h2 { margin:0 0 8px; font-size:22px; }
.sheet textarea { width:100%; min-height:150px; font:16px/1.4 ui-monospace, Menlo, monospace; padding:10px; border:1px solid var(--line); border-radius:12px; }
.sheet .msg { font-size:16px; color:var(--rec); min-height:22px; margin:6px 0; }
.sheet .row { margin-top:8px; flex-wrap:wrap; }
.small { font-size:15px; color:var(--muted); }
</style></head>
<body>
<header>
  <div class="row"><div class="bar"><i id="bar"></i></div><span id="count">0/0</span>
    <button class="btn-accent" id="exportBtn" type="button">Export picks</button></div>
  <div class="row tools">
    <input id="jump" type="number" inputmode="numeric" placeholder="#" aria-label="Jump to sire number">
    <button id="jumpBtn" type="button">Go</button>
    <button id="importBtn" type="button">Import code</button>
    <button id="acceptBtn" type="button">Accept 推薦 for rest</button>
    <button id="openQ" type="button" class="btn-accent">Open questions</button>
  </div>
</header>
<div id="reminder"><div class="row"><span id="remText">25 picks since your last export.</span>
  <button class="btn-accent" id="remExport" type="button">Export</button></div></div>
<main><div class="card" id="card"></div></main>
<nav><button id="backBtn" type="button">‹ Back</button><button id="nextBtn" type="button">Next ›</button></nav>

<div class="sheet" id="exportSheet"><div>
  <h2>Export picks</h2>
  <div class="small">Code for all picks so far (s = skip, o = own name). Copy it and send it to the session.</div>
  <textarea id="exportText" readonly></textarea>
  <div class="msg" id="exportMsg"></div>
  <div class="row"><button class="btn-accent" id="copyBtn" type="button">Copy</button><button id="exportClose" type="button">Close</button></div>
</div></div>
<div class="sheet" id="importSheet"><div>
  <h2>Import code</h2>
  <div class="small">Paste an exported code. Its picks replace the picks for the same sires here.</div>
  <textarea id="importText" placeholder="1b 2a 3s 4o:名字 …"></textarea>
  <div class="msg" id="importMsg"></div>
  <div class="row"><button class="btn-accent" id="doImport" type="button">Import</button><button id="importClose" type="button">Close</button></div>
</div></div>

<script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);
  var KEY = 'nzb_sire_picker_v1';
  var byId = {}; D.forEach(function (r, i) { byId[r.id] = i; });
  var st = { picks: {}, q: {}, cur: 0, sinceExport: 0 };
  function load() { try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.picks) st = s; } catch (e) {} if (!st.q) st.q = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function A(r) { return r.q ? (st.q[r.id] || '') : (st.picks[r.id] || ''); }        // the answer for a card (questions kept apart)
  function setA(r, p) { if (r.q) st.q[r.id] = p; else st.picks[r.id] = p; }
  function nPicked() { return D.filter(function (r) { return A(r); }).length; }
  function openList() {                                   // unanswered questions + unpicked cards up to the furthest pick
    var far = -1;
    D.forEach(function (r, i) { if ((A(r) && A(r) !== 's') || r.dz) far = i; });   // his own picks / recorded decisions only
    var L = [];
    D.forEach(function (r, i) { if ((r.q && !A(r)) || (!r.q && !A(r) && !r.dz && !r.rz && i <= far)) L.push(i); });
    return L;
  }
  function code() {
    var out = [];
    D.forEach(function (r) { var p = A(r); if (p) out.push(r.id + p); });
    return out.join(' ');
  }
  function render() {
    var r = D[st.cur], p = A(r);
    var h = '<div class="num">#' + r.id + ' · card ' + (st.cur + 1) + ' of ' + D.length + '</div>';
    h += '<h1>' + esc(r.en) + '</h1>';
    h += '<div class="meta">' + esc(r.c) + ' · ' + esc(r.y) + ' · ' + r.m + ' mention' + (r.m === 1 ? '' : 's') + '</div>';
    h += '<div class="who">' + esc(r.who) + '</div>';
    if (r.rz) h += '<div class="resolved">' + (r.rb === 'HKJC' ? '已定 HKJC 名 ' + esc(r.rz) + ' (always HKJC)' : '已定 ' + esc(r.rz) + ' (established name for this stallion: Flameracing / wpstud / approved)') + ': no pick needed; any pick here is overridden.</div>';
    if (r.dh) h += '<div class="hold">暫緩 ' + esc(r.dh) + '</div>';
    else if (!r.rz && r.dz) h += '<div class="decided">已選 ' + esc(r.dz) + ' (Karson, recorded)</div>';
    if (r.q) h += '<div class="hold">暫緩 · open question: ' + esc(r.qn) + '</div>';
    if (r.flag) h += '<div class="flag">⚑ ' + esc(r.flag) + '</div>';
    r.o.forEach(function (o) {
      var rec = o.k === r.p, ch = p === o.k;
      h += '<button type="button" class="opt' + (rec ? ' rec' : '') + (ch ? ' chosen' : '') + ((r.dz && o.zh === r.dz) || (r.rz && o.zh === r.rz) ? ' recorded' : '') + '" data-pick="' + o.k + '">' +
        '<div class="top"><span class="k">' + o.k + '</span><span class="zh">' + esc(o.zh) + '</span>' +
        (rec ? '<span class="tag">推薦</span>' : '') + '<span class="src">' + esc(o.s) + '</span></div>' +
        '<div class="x">' + esc(o.x) + '</div></button>';
      if (rec) h += '<div class="pr">推薦: ' + esc(r.pr) + '</div>';
    });
    var own = p.indexOf('o:') === 0 ? p.slice(2) : '';
    h += '<div class="alts"><button type="button" class="alt' + (p === 's' ? ' chosen' : '') + '" data-pick="s">Skip</button></div>';
    h += '<div class="own"><input id="ownIn" type="text" placeholder="Own name 中文" value="' + esc(own) + '" aria-label="Own name">' +
      '<button type="button" class="alt' + (own ? ' chosen' : '') + '" id="ownBtn">Use own</button></div>';
    h += '<div class="state">' + (p ? 'Picked: ' + esc(label(r, p)) : 'Not picked yet') + '</div>';
    document.getElementById('card').innerHTML = h;
    var n = nPicked();
    document.getElementById('count').textContent = n + '/' + D.length;
    document.getElementById('bar').style.width = (100 * n / D.length) + '%';
    document.getElementById('backBtn').disabled = st.cur === 0;
    document.getElementById('nextBtn').disabled = st.cur === D.length - 1;
    document.getElementById('reminder').style.display = st.sinceExport >= 25 ? 'block' : 'none';
    document.getElementById('remText').textContent = st.sinceExport + ' picks since your last export.';
    var nq = openList().length;
    document.getElementById('openQ').textContent = 'Open questions (' + nq + ')';
    document.getElementById('openQ').disabled = nq === 0;
  }
  function label(r, p) {
    if (p === 's') return 'skip';
    if (p.indexOf('o:') === 0) return 'own name ' + p.slice(2);
    var o = r.o.filter(function (x) { return x.k === p; })[0];
    return p + ' ' + (o ? o.zh : '');
  }
  function pick(p) {
    var r = D[st.cur];
    if (r.q && p === 's') { if (st.cur < D.length - 1) st.cur += 1; save(); render(); window.scrollTo(0, 0); return; }   // a question stays open
    if (A(r) !== p) st.sinceExport += 1;
    setA(r, p);
    if (st.cur < D.length - 1) st.cur += 1;
    save(); render(); window.scrollTo(0, 0);
  }
  function go(i) { st.cur = Math.max(0, Math.min(D.length - 1, i)); save(); render(); window.scrollTo(0, 0); }
  document.getElementById('card').addEventListener('click', function (e) {
    var b = e.target.closest('[data-pick]');
    if (b) { pick(b.getAttribute('data-pick')); return; }
    if (e.target.closest('#ownBtn')) {
      var v = document.getElementById('ownIn').value.replace(/\s+/g, '');
      if (v) pick('o:' + v); else document.getElementById('ownIn').focus();
    }
  });
  document.getElementById('card').addEventListener('keydown', function (e) {
    if (e.target.id === 'ownIn' && e.key === 'Enter') document.getElementById('ownBtn').click();
  });
  document.getElementById('backBtn').onclick = function () { go(st.cur - 1); };
  document.getElementById('nextBtn').onclick = function () { go(st.cur + 1); };
  document.getElementById('jumpBtn').onclick = function () {
    var v = parseInt(document.getElementById('jump').value, 10);
    if (isNaN(v)) return;
    if (byId[v] !== undefined) return go(byId[v]);
    var best = 0, d = 1e9;                                   // nearest number in the list (some numbers were removed)
    D.forEach(function (r, i) { if (Math.abs(r.id - v) < d) { d = Math.abs(r.id - v); best = i; } });
    go(best);
  };
  function openSheet(id) { document.getElementById(id).style.display = 'block'; }
  function closeSheet(id) { document.getElementById(id).style.display = 'none'; }
  function showExport() {
    var t = document.getElementById('exportText');
    t.value = code() || '(no picks yet)';
    document.getElementById('exportMsg').textContent = nPicked() + ' picks in this code.';
    st.sinceExport = 0; save(); render(); openSheet('exportSheet');
  }
  document.getElementById('exportBtn').onclick = showExport;
  document.getElementById('remExport').onclick = showExport;
  document.getElementById('exportClose').onclick = function () { closeSheet('exportSheet'); };
  document.getElementById('copyBtn').onclick = function () {
    var t = document.getElementById('exportText'), msg = document.getElementById('exportMsg');
    function fallback() {
      try { t.removeAttribute('readonly'); t.focus(); t.select(); t.setSelectionRange(0, t.value.length);
            var ok = document.execCommand('copy'); t.setAttribute('readonly', '');
            msg.textContent = ok ? 'Copied.' : 'Select the text and copy it by hand.'; }
      catch (e) { msg.textContent = 'Select the text and copy it by hand.'; }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(t.value).then(function () { msg.textContent = 'Copied.'; }, fallback);
      else fallback();
    } catch (e) { fallback(); }
  };
  document.getElementById('importBtn').onclick = function () { document.getElementById('importMsg').textContent = ''; openSheet('importSheet'); };
  document.getElementById('importClose').onclick = function () { closeSheet('importSheet'); };
  document.getElementById('doImport').onclick = function () {
    var txt = document.getElementById('importText').value.trim(), ok = 0, bad = [];
    txt.split(/\s+/).forEach(function (tok) {
      if (!tok) return;
      var m = tok.match(/^(\d+)([abcs]|o:(.+))$/);
      if (!m || byId[+m[1]] === undefined) { bad.push(tok); return; }
      setA(D[byId[+m[1]]], m[2]); ok += 1;
    });
    var first = 0; while (first < D.length && A(D[first])) first += 1;
    st.cur = Math.min(first, D.length - 1);
    save(); render();
    document.getElementById('importMsg').textContent = 'Imported ' + ok + ' picks.' + (bad.length ? ' Not understood: ' + bad.slice(0, 5).join(' ') : '');
  };
  document.getElementById('acceptBtn').onclick = function () {
    var rest = D.filter(function (r) { return !r.q && !A(r); });   // open questions need a real answer
    if (!rest.length) { alert('Every sire already has a pick.'); return; }
    if (!confirm('Accept 推薦 for all ' + rest.length + ' remaining sires?')) return;
    rest.forEach(function (r) { setA(r, r.p); });
    st.sinceExport += rest.length;
    save(); render();
  };
  document.getElementById('openQ').onclick = function () {
    var L = openList();
    if (!L.length) return;
    var nxt = L.filter(function (i) { return i > st.cur; })[0];
    go(nxt === undefined ? L[0] : nxt);
  };
  load();
  if (!(st.cur >= 0 && st.cur < D.length)) st.cur = 0;
  render();
  window.__picker = { code: code, state: function () { return st; }, open: function () { return openList().map(function (i) { return D[i].id; }); } };   // for testing
})();
</script>
</body></html>
