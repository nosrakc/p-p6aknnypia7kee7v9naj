<title>Sire Picker</title>
<style>
:root { --bg:#f6f3ee; --card:#ffffff; --ink:#1d1b18; --muted:#5f5a52; --line:#ddd5c8; --accent:#c96a1b; --accent-soft:#fbebdc;
        --rec:#2a6b3c; --rec-soft:#e6f2e9; --chosen:#1f4e8c; --chosen-soft:#e3ecf8; --flag:#9a4a00; --flag-soft:#fff3e0; }
html[data-theme="dark"] { color-scheme: dark;
  --bg:#121212; --card:#1e1e1e; --ink:#e8e8e8; --muted:#a9a9a9; --line:#3a3a3a; --accent:#e08a3c; --accent-soft:#3a2a18;
  --rec:#f2b632; --rec-soft:#2a2410; --chosen:#6aa9ff; --chosen-soft:#16263d; --flag:#ffb561; --flag-soft:#33250f;
  --btn:#2a2a2a; --sheet:#1e1e1e; --track:#3a3a3a; --field:#262626; --accent-ink:#121212; }
html[data-theme="light"] { color-scheme: light; --btn:#fff; --sheet:#fff; --track:#e8e1d6; --field:#fff; --accent-ink:#fff; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system, "PingFang TC", "Helvetica Neue", sans-serif; font-size:18px; }
body { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
header { position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 16px 8px; border-bottom:1px solid var(--line); }
.row { display:flex; gap:8px; align-items:center; }
.bar { flex:1; height:12px; background:var(--track); border-radius:6px; overflow:hidden; }
.bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
#count { font-weight:700; font-variant-numeric:tabular-nums; min-width:76px; text-align:right; }
button { font:inherit; border:1px solid var(--line); background:var(--btn); color:var(--ink); border-radius:12px; padding:10px 12px; cursor:pointer; }
button:active { transform:scale(.98); }
.btn-accent { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700; }
.tools { margin-top:8px; }
.tools input { width:84px; font:inherit; background:var(--field); color:var(--ink); padding:9px 10px; border:1px solid var(--line); border-radius:12px; }
main { padding:12px 16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
.num { color:var(--muted); font-size:16px; }
h1 { font-size:28px; line-height:1.15; margin:2px 0 6px; overflow-wrap:anywhere; }
.meta { color:var(--muted); font-size:16px; margin-bottom:8px; }
.who { font-size:17px; line-height:1.4; margin:8px 0 12px; }
.flag { background:var(--flag-soft); color:var(--flag); border-radius:10px; padding:8px 10px; font-size:16px; margin-bottom:12px; }
.opt { display:block; width:100%; text-align:left; margin:10px 0; padding:14px; border-width:2px; border-radius:16px; }
.opt .top { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.opt .k { font-weight:800; color:var(--muted); font-size:20px; }
.opt .zh { font-size:30px; font-weight:700; letter-spacing:1px; }
.opt .src { font-size:14px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 8px; }
.opt .x { font-size:16px; color:var(--muted); margin-top:6px; line-height:1.35; }
.opt.rec { border-color:var(--rec); background:var(--rec-soft); }
html[data-theme="dark"] .opt.rec { box-shadow:0 0 0 2px var(--rec); }
html[data-theme="dark"] .opt .tag { color:#121212; }
.opt .tag { font-size:15px; font-weight:700; color:#fff; background:var(--rec); border-radius:999px; padding:2px 10px; }
.opt.chosen, .alt.chosen { border-color:var(--chosen); background:var(--chosen-soft); box-shadow:0 0 0 2px var(--chosen) inset; }
.pr { font-size:15px; color:var(--rec); margin:-2px 0 6px 4px; }
.alts { display:flex; gap:10px; margin-top:6px; }
.alt { flex:1; padding:14px; border-radius:14px; border-width:2px; }
.own { display:flex; gap:8px; margin-top:10px; }
.own input { flex:1; min-width:0; font:inherit; background:var(--field); color:var(--ink); font-size:22px; padding:12px; border:2px solid var(--line); border-radius:14px; }
.state { margin-top:10px; font-size:16px; color:var(--chosen); font-weight:600; min-height:22px; }
nav { position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--bg); border-top:1px solid var(--line);
      padding:10px 16px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; }
nav button { flex:1; padding:14px; font-size:18px; }
#reminder { display:none; margin:0 16px 0; background:var(--accent-soft); border:1px solid var(--accent); border-radius:14px; padding:10px 12px; }
#reminder .row { justify-content:space-between; }
.sheet { display:none; position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.35); }
.sheet > div { position:absolute; left:0; right:0; bottom:0; background:var(--sheet); color:var(--ink); border-radius:20px 20px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto; }
.sheet h2 { margin:0 0 8px; font-size:22px; }
.sheet textarea { background:var(--field); color:var(--ink); width:100%; min-height:150px; font:16px/1.4 ui-monospace, Menlo, monospace; padding:10px; border:1px solid var(--line); border-radius:12px; }
.sheet .msg { font-size:16px; color:var(--rec); min-height:22px; margin:6px 0; }
.sheet .row { margin-top:8px; flex-wrap:wrap; }
.small { font-size:15px; color:var(--muted); }
#themeBtn { padding:0; width:40px; height:40px; flex:none; border-radius:50%; font-size:20px; line-height:1; }
html[data-theme="dark"] .sheet { background:rgba(0,0,0,.6); }
</style></head>

<header>
  <div class="row"><div class="bar"><i id="bar"></i></div><span id="count">0/0</span>

    <button id="themeBtn" type="button" aria-label="Toggle dark / light mode" title="Dark / light">☾</button></div>
  <div class="row tools">

<nav><button id="backBtn" type="button">‹ Back</button><button id="nextBtn" type="button">Next ›</button></nav>

<div class="sheet" id="exportSheet"><div>
  <h2>Export picks</h2>
  <div class="small">Code for all picks so far (s = skip, o = own name). Copy it and send it to the session.</div>
  <textarea id="exportText" readonly></textarea>
  <div class="msg" id="exportMsg"></div>
  <div class="row"><button class="btn-accent" id="copyBtn" type="button">Copy</button><button id="exportClose" type="button">Close</button></div>
</div></div>
<div class="sheet" id="importSheet"><div>
  <h2>Import code</h2>
  <div class="small">Paste an exported code. Its picks replace the picks for the same sires here.</div>
  <textarea id="importText" placeholder="1b 2a 3s 4o:名字 …"></textarea>
  <div class="msg" id="importMsg"></div>
  <div class="row"><button class="btn-accent" id="doImport" type="button">Import</button><button id="importClose" type="button">Close</button></div>
</div></div>

"Short form: \"Snow\""},{"k":"c","zh":"莊雪","s":"coined","x":"Sound+meaning: zong1 ≈ Jon, + snow"}],"p":"a","pr":"Recognisable rendering of the name"},{"id":615,"en":"Trust in a Gust","c":"AUS","y":2009,"m":1,"who":"Australian son of Keep the Faith; won the Sir Rupert Clarke Stakes and Toorak Handicap (Gr 1s); died 2023","flag":"","o":[{"k":"a","zh":"信風","s":"coined","x":"Meaning: trade wind; puns \"trust\" + \"gust\""},{"k":"b","zh":"信靠疾風","s":"coined","x":"Meaning: trust in the swift wind"},{"k":"c","zh":"乘風而信","s":"coined","x":"Meaning: ride the wind with faith"}],"p":"a","pr":"Neat two-character pun on both words"},{"id":616,"en":"Make Believe","c":"GB","y":2012,"m":1,"who":"British-bred son of Makfi; won the 2015 Poule d'Essai des Poulains and Prix de la Forêt; sire of Mishriff","flag":"","o":[{"k":"a","zh":"虛則實之","s":"HKJC","x":"HKJC official sire name \"Make Believe (Gb)\"; idiom \"feint where real\", make-believe"},{"k":"b","zh":"弄假成真","s":"coined","x":"Idiom: make-believe turned real; auspicious"},{"k":"c","zh":"幻想成真","s":"coined","x":"Meaning: fantasy comes true"}],"p":"a","pr":"Official HKJC name"},{"id":617,"en":"Universal Ruler","c":"AUS","y":"?","m":1,"who":"Presumably the WA-bred son of Scenic; Listed winner, WA champion first-season sire 2013-14","flag":"","o":[{"k":"a","zh":"天下霸主","s":"coined","x":"Meaning: ruler of all under heaven"},{"k":"b","zh":"寰宇主宰","s":"coined","x":"Meaning: ruler of the universe"},{"k":"c","zh":"環宇之王","s":"coined","x":"Meaning: king of the world"}],"p":"a","pr":"Natural, strong four-character name"},{"id":618,"en":"Math Wizard","c":"USA","y":2016,"m":1,"who":"US-bred son of Algorithms; won the 2019 Pennsylvania Derby (Gr 1)","flag":"","o":[{"k":"a","zh":"數學奇才","s":"coined","x":"Meaning: math wizard"},{"k":"b","zh":"神算","s":"coined","x":"Meaning: divine calculator, short form"},{"k":"c","zh":"算術大師","s":"coined","x":"Meaning: master of arithmetic"}],"p":"a","pr":"Exact, clear meaning"},{"id":619,"en":"Space Traveller","c":"GB","y":2014,"m":1,"who":"British-bred son of Bated Breath; won the 2017 Jersey Stakes (Gr 3) and a Leopardstown Gr 2; stands at Ballyhane Stud, Ireland","flag":"","o":[{"k":"a","zh":"太空旅人","s":"coined","x":"Meaning: space traveller"},{"k":"b","zh":"星際旅者","s":"coined","x":"Meaning: interstellar traveller"},{"k":"c","zh":"太空漫遊","s":"coined","x":"Meaning: space odyssey/roaming"}],"p":"a","pr":"Exact, clear meaning"},{"id":620,"en":"Horizon","c":"?","y":"?","m":1,"who":"Sire named in the book with no lot cited; no further record checked","flag":"","o":[{"k":"a","zh":"天際","s":"coined","x":"Meaning: horizon, the sky's edge"},{"k":"b","zh":"地平線","s":"coined","x":"Meaning: horizon, literal"},{"k":"c","zh":"天邊","s":"coined","x":"meaning: \"edge of the sky\" (replaces 遠方, already another horse's or sire's name)"}],"p":"a","pr":"Elegant and short"},{"id":621,"en":"Noble Bird","c":"USA","y":"?","m":1,"who":"US-bred son of Birdstone; won the 2015 Stephen Foster Handicap (Gr 1); stands at Ocala Stud, Florida","flag":"","o":[{"k":"a","zh":"鳳凰","s":"coined","x":"Meaning: phoenix, the noble bird of Chinese lore"},{"k":"b","zh":"貴鳥","s":"coined","x":"Meaning: noble bird, literal"},{"k":"c","zh":"鳳翔","s":"coined","x":"Meaning: phoenix soaring"}],"p":"a","pr":"Culturally apt for HK readers"},{"id":622,"en":"Coulsty","c":"?","y":"?","m":1,"who":"Son of Kodiac; won the Gr 3 Prix de Meautry; stood at Rathasker Stud (IRE) then Norman Court Stud (GB); sire of Shantisara","flag":"","o":[{"k":"a","zh":"高士迪","s":"coined","x":"Sound: gou1 si6 dik6 ≈ Coul-sty"},{"k":"b","zh":"古士迪","s":"coined","x":"Sound: gu2 si6 dik6 ≈ Coul-sty"},{"k":"c","zh":"高斯迪","s":"coined","x":"Sound: gou1 si1 dik6 ≈ Coul-sty"}],"p":"a","pr":"Closest sound, common HK name style"},{"id":623,"en":"Legislate","c":"?","y":"?","m":1,"who":"Possibly the South African Horse of the Year by Dynasty (Cheveley Stud); no lot cited, not confirmed","flag":"identity not confirmed (no lot cited)","o":[{"k":"a","zh":"力仕禮","s":"coined","x":"Sound: lik6 si6 lai5 ≈ Leg-is-late; \"strength, gentleman, courtesy\""},{"k":"b","zh":"立法","s":"coined","x":"Meaning: legislate (strongly evokes LegCo in HK)"},{"k":"c","zh":"定章","s":"coined","x":"Meaning: set the rules"}],"p":"a","pr":"Sound name; avoids LegCo association"},{"id":624,"en":"King of Danes","c":"?","y":"?","m":1,"who":"Sire of ORIDANE (in this book, lot 229); no further record checked","flag":"HKJC 丹山王 is a Hong Kong runner of the same name - not offered","o":[{"k":"a","zh":"丹麥之王","s":"coined","x":"Meaning: king of the Danes"},{"k":"b","zh":"丹皇","s":"coined","x":"Meaning: Dane emperor, short form"},{"k":"c","zh":"丹麥皇","s":"coined","x":"Meaning: Danish king"}],"p":"a","pr":"Faithful meaning"},{"id":625,"en":"Interstellar","c":"AUS","y":"?","m":1,"who":"Sire of YIPPYIO (in this book, lot 354); no further record checked","flag":"HKJC 真精采 is a Hong Kong runner (gelding by Magnus) - not offered","o":[{"k":"a","zh":"星際","s":"coined","x":"Meaning: interstellar"},{"k":"b","zh":"星際啓航","s":"coined","x":"Meaning: interstellar voyage begins"},{"k":"c","zh":"星海","s":"coined","x":"meaning: \"sea of stars\" (replaces 星河, already another horse's or sire's name)"}],"p":"a","pr":"Short, exact meaning"},{"id":626,"en":"Adios","c":"?","y":"?","m":1,"who":"Sire named in the lot 295 family; no further record checked","flag":"HKJC 順勢而飛 is a Hong Kong runner (gelding by Snitzel) - not offered","o":[{"k":"a","zh":"雅迪仕","s":"coined","x":"Sound: ngaa5 dik6 si6 ≈ A-di-os; \"elegant scholar\""},{"k":"b","zh":"亞迪奧","s":"coined","x":"Sound: aa3 dik6 ou3 ≈ A-di-os"},{"k":"c","zh":"再會","s":"coined","x":"Meaning: goodbye (Spanish \"adiós\")"}],"p":"a","pr":"Pleasant sound name; avoids a farewell meaning"},{"id":627,"en":"Imperialist","c":"?","y":"?","m":1,"who":"Older stallion in the lot 424 pedigree (sire in ROMANTIC ORCHID's line); not the NZ gelding IMPERIALIST (2021, by Churchill, HKJC-overseas 擁帝制)","flag":"New 21 Oct 2026: removed from the printed family-sire table (v23 printed 擁帝制, the name of a different horse)","o":[{"k":"a","zh":"帝國之主","s":"coined","x":"meaning: \"lord of the empire\""},{"k":"b","zh":"皇權者","s":"coined","x":"meaning: \"holder of imperial power\""},{"k":"c","zh":"英柏利","s":"coined","x":"jing paak lei: Im-pe-ri(alist), sound"}],"p":"a","pr":"Clear meaning; 擁帝制 belongs to the NZ gelding"}]</script>
<script>
(function () {
  var tb = document.getElementById('themeBtn');
  function paint() { var d = document.documentElement.getAttribute('data-theme') === 'dark'; tb.textContent = d ? '☀︎' : '☾';
    var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = d ? '#121212' : '#f6f3ee'; }
  tb.addEventListener('click', function () { var n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', n); try { localStorage.setItem('nzb_picker_theme', n); } catch (e) {} paint(); });
  paint();
})();
</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);
  var KEY = 'nzb_sire_picker_v1';
  var byId = {}; D.forEach(function (r, i) { byId[r.id] = i; });
  var st = { picks: {}, cur: 0, sinceExport: 0 };
  function load() { try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.picks) st = s; } catch (e) {} }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function nPicked() { return Object.keys(st.picks).length; }
  function code() {
    var out = [];
    D.forEach(function (r) { var p = st.picks[r.id]; if (p) out.push(r.id + p); });
    return out.join(' ');
  }
  function render() {
    var r = D[st.cur], p = st.picks[r.id] || '';
    var h = '<div class="num">#' + r.id + ' · card ' + (st.cur + 1) + ' of ' + D.length + '</div>';
    h += '<h1>' + esc(r.en) + '</h1>';
    h += '<div class="meta">' + esc(r.c) + ' · ' + esc(r.y) + ' · ' + r.m + ' mention' + (r.m === 1 ? '' : 's') + '</div>';
    h += '<div class="who">' + esc(r.who) + '</div>';
    if (r.flag) h += '<div class="flag">⚑ ' + esc(r.flag) + '</div>';
    r.o.forEach(function (o) {
      var rec = o.k === r.p, ch = p === o.k;
      h += '<button type="button" class="opt' + (rec ? ' rec' : '') + (ch ? ' chosen' : '') + '" data-pick="' + o.k + '">' +
        '<div class="top"><span class="k">' + o.k + '</span><span class="zh">' + esc(o.zh) + '</span>' +
        (rec ? '<span class="tag">推薦</span>' : '') + '<span class="src">' + esc(o.s) + '</span></div>' +
        '<div class="x">' + esc(o.x) + '</div></button>';
      if (rec) h += '<div class="pr">推薦: ' + esc(r.pr) + '</div>';
    });
    var own = p.indexOf('o:') === 0 ? p.slice(2) : '';
    h += '<div class="alts"><button type="button" class="alt' + (p === 's' ? ' chosen' : '') + '" data-pick="s">Skip</button></div>';
    h += '<div class="own"><input id="ownIn" type="text" placeholder="Own name 中文" value="' + esc(own) + '" aria-label="Own name">' +
      '<button type="button" class="alt' + (own ? ' chosen' : '') + '" id="ownBtn">Use own</button></div>';
    h += '<div class="state">' + (p ? 'Picked: ' + esc(label(r, p)) : 'Not picked yet') + '</div>';
    document.getElementById('card').innerHTML = h;
    var n = nPicked();
    document.getElementById('count').textContent = n + '/' + D.length;
    document.getElementById('bar').style.width = (100 * n / D.length) + '%';
    document.getElementById('backBtn').disabled = st.cur === 0;
    document.getElementById('nextBtn').disabled = st.cur === D.length - 1;
    document.getElementById('reminder').style.display = st.sinceExport >= 25 ? 'block' : 'none';
    document.getElementById('remText').textContent = st.sinceExport + ' picks since your last export.';
  }
  function label(r, p) {
    if (p === 's') return 'skip';
    if (p.indexOf('o:') === 0) return 'own name ' + p.slice(2);
    var o = r.o.filter(function (x) { return x.k === p; })[0];
    return p + ' ' + (o ? o.zh : '');
  }
  function pick(p) {
    var r = D[st.cur];
    if (st.picks[r.id] !== p) st.sinceExport += 1;
    st.picks[r.id] = p;
    if (st.cur < D.length - 1) st.cur += 1;
    save(); render(); window.scrollTo(0, 0);
  }
  function go(i) { st.cur = Math.max(0, Math.min(D.length - 1, i)); save(); render(); window.scrollTo(0, 0); }
  document.getElementById('card').addEventListener('click', function (e) {
    var b = e.target.closest('[data-pick]');
    if (b) { pick(b.getAttribute('data-pick')); return; }
    if (e.target.closest('#ownBtn')) {
      var v = document.getElementById('ownIn').value.replace(/\s+/g, '');
      if (v) pick('o:' + v); else document.getElementById('ownIn').focus();
    }
  });
  document.getElementById('card').addEventListener('keydown', function (e) {
    if (e.target.id === 'ownIn' && e.key === 'Enter') document.getElementById('ownBtn').click();
  });
  document.getElementById('backBtn').onclick = function () { go(st.cur - 1); };
  document.getElementById('nextBtn').onclick = function () { go(st.cur + 1); };
  document.getElementById('jumpBtn').onclick = function () {
    var v = parseInt(document.getElementById('jump').value, 10);
    if (isNaN(v)) return;
    if (byId[v] !== undefined) return go(byId[v]);
    var best = 0, d = 1e9;                                   // nearest number in the list (some numbers were removed)
    D.forEach(function (r, i) { if (Math.abs(r.id - v) < d) { d = Math.abs(r.id - v); best = i; } });
    go(best);
  };
  function openSheet(id) { document.getElementById(id).style.display = 'block'; }
  function closeSheet(id) { document.getElementById(id).style.display = 'none'; }
  function showExport() {
    var t = document.getElementById('exportText');
    t.value = code() || '(no picks yet)';
    document.getElementById('exportMsg').textContent = nPicked() + ' picks in this code.';
    st.sinceExport = 0; save(); render(); openSheet('exportSheet');
  }
  document.getElementById('exportBtn').onclick = showExport;
  document.getElementById('remExport').onclick = showExport;
  document.getElementById('exportClose').onclick = function () { closeSheet('exportSheet'); };
  document.getElementById('copyBtn').onclick = function () {
    var t = document.getElementById('exportText'), msg = document.getElementById('exportMsg');
    function fallback() {
      try { t.removeAttribute('readonly'); t.focus(); t.select(); t.setSelectionRange(0, t.value.length);
            var ok = document.execCommand('copy'); t.setAttribute('readonly', '');
            msg.textContent = ok ? 'Copied.' : 'Select the text and copy it by hand.'; }
      catch (e) { msg.textContent = 'Select the text and copy it by hand.'; }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(t.value).then(function () { msg.textContent = 'Copied.'; }, fallback);
      else fallback();
    } catch (e) { fallback(); }
  };
  document.getElementById('importBtn').onclick = function () { document.getElementById('importMsg').textContent = ''; openSheet('importSheet'); };
  document.getElementById('importClose').onclick = function () { closeSheet('importSheet'); };
  document.getElementById('doImport').onclick = function () {
    var txt = document.getElementById('importText').value.trim(), ok = 0, bad = [];
    txt.split(/\s+/).forEach(function (tok) {
      if (!tok) return;
      var m = tok.match(/^(\d+)([abcs]|o:(.+))$/);
      if (!m || byId[+m[1]] === undefined) { bad.push(tok); return; }
      st.picks[+m[1]] = m[2]; ok += 1;
    });
    var first = 0; while (first < D.length && st.picks[D[first].id]) first += 1;
    st.cur = Math.min(first, D.length - 1);
    save(); render();
    document.getElementById('importMsg').textContent = 'Imported ' + ok + ' picks.' + (bad.length ? ' Not understood: ' + bad.slice(0, 5).join(' ') : '');
  };
  document.getElementById('acceptBtn').onclick = function () {
    var rest = D.filter(function (r) { return !st.picks[r.id]; });
    if (!rest.length) { alert('Every sire already has a pick.'); return; }
    if (!confirm('Accept 推薦 for all ' + rest.length + ' remaining sires?')) return;
    rest.forEach(function (r) { st.picks[r.id] = r.p; });
    st.sinceExport += rest.length;
    save(); render();
  };
  load();
  if (!(st.cur >= 0 && st.cur < D.length)) st.cur = 0;
  render();
  window.__picker = { code: code, state: function () { return st; } };   // for testing
})();
</script>
</body></html>
